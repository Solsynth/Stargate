siteUrl = "http://localhost:3000"
baseUrl = "http://localhost:5011"

[http]
port = "8080"

[grpc]
port = "9090"
# TLS is on by default (the C# fleet and Blade dial https://_grpc.stargate).
# server.crt/server.key are issued by the DysonNetwork CA (self-signed);
# clients skip CA validation, mirroring the fleet convention.
useTLS = true
certFile = "Keys/server.crt"
keyFile = "Keys/server.key"

[database]
dsn = "host=localhost port=5432 user=postgres dbname=dyson_stargate sslmode=disable"

[redis]
# Optional cache/session acceleration. Empty disables cache-backed features.
addr = ""
password = ""
db = 0

[nats]
# Optional event bus. Empty disables event consumers and realtime publishing.
target = ""
sessionEventsStream = "auth_session_events"
sessionEventsSubject = "auth.session.revoked"
websocketPushStream = "websocket_push"
websocketPushSubject = "websocket.push"

[auth]
issuer = "solar-network"
# Issuers accepted for both ordinary and OIDC access/refresh tokens. Keep old
# values here when changing issuer so already-issued tokens remain usable.
validIssuers = ["solar-network", "https://nt.solian.app"]
audiences = ["http://localhost:5071", "https://localhost:7099"]
publicKeyPath = "Keys/PublicKey.pem"
privateKeyPath = "Keys/PrivateKey.pem"
accessTokenLifetime = "5m"
refreshTokenLifetime = "720h"
# How long the immediately previous refresh token is still accepted after a
# rotation. Refresh rotation revokes the presented token before the replacement
# is delivered, so a dropped/timed-out response (or a concurrent duplicate)
# would otherwise force a re-login. Longer = more tolerant, wider replay
# window. "0s" disables the grace.
refreshGracePeriod = "60s"
cookieDomain = "localhost"
cookieSecure = false

[oidcProvider]
issuerUri = "https://nt.solian.app"
publicKeyPath = "Keys/PublicKey.pem"
privateKeyPath = "Keys/PrivateKey.pem"
accessTokenLifetime = "5m"
refreshTokenLifetime = "720h"
authorizationCodeLifetime = "30m"
requireHttpsMetadata = true

# Optional local OAuth/OIDC clients. Use these when DysonNetwork.Develop is
# unavailable. The client ID must be stable because it is stored in OAuth
# sessions. status=2 means Production and enforces redirectUris; status=1
# (Staging) accepts any redirect URI, matching Develop's behavior.
# [[oidcProvider.clients]]
# id = "00000000-0000-0000-0000-000000000001"
# slug = "my-local-client"
# name = "My Local Client"
# clientSecret = "replace-with-a-secret"
# status = 2
# homeUri = "https://client.example.com"
# redirectUris = ["https://client.example.com/oauth/callback"]
# allowedScopes = ["openid", "profile", "email"]
# isPublicClient = false

[captcha]
provider = "cloudflare"
apiKey = "0x4AAAAAABCDUdOujj4feOb_"
apiSecret = ""
skip = true
# Captcha is REQUIRED for the captcha-gated flows (account creation, password
# reset request, /auth/captcha/verify). A deployment whose verifier is
# unusable must opt out explicitly with allow_disabled = true; otherwise
# Stargate refuses to start and ValidateCaptcha fails every gated request.
# The shipped example opts out so it stays runnable; a production deployment
# should instead configure provider/apiSecret (and apiKey where required).
allow_disabled = true

[webauthn]
rpId = "localhost"
rpName = "Solar Network"

# Account activation (mirrors Passport's AccountActivation). Entry-test (exam)
# logic stays in Passport: when testsEnabled is true and requiredTestKeys is
# non-empty, contact verification does NOT activate the account here — Passport
# evaluates the attempts and publishes accounts.activated, which Stargate
# consumes. With no required tests (default), a verified contact activates the
# account immediately.
[accountActivation]
testsEnabled = false
requiredTestKeys = []

[geoip]
databasePath = "Keys/GeoLite2-City.mmdb"

# Outbound gRPC integrations are optional. An empty target disables the
# corresponding enrichment, notification, lookup, or realtime feature; the
# remaining Stargate routes continue to serve.
# A configured target is lazy-dialed and RPC failures also degrade per feature.
# Develop is only needed when no matching local OAuth client is configured.
# Wallet, Drive, Pass, Ring, and Blade may remain empty independently.
#
# Keep the table active with empty defaults for simple environment overrides.
# Each target may be set independently.
[services]
develop = { grpc = "" }
drive = { grpc = "" }
wallet = { grpc = "" }
pass = { grpc = "" }
blade = { grpc = "" }
ring = { grpc = "" }

[discovery]
# Register with Blade service discovery so Blade's /meta capability
# aggregator and proxy resolve this instance (auth.*, e2ee, permissions,
# admin.*, accounts.*). Mirror the C# Blade:ServiceDiscovery settings.
enabled = false
target = "blade:9090"
registrationToken = ""
service = "stargate"
instanceId = ""
# Defaults mirror the C# fallback: http://{service}:{httpPort} and
# {service}:{grpcPort}; Blade probes {httpEndpoint}/health and fetches
# capabilities from {grpcEndpoint}.
httpEndpoint = ""
grpcEndpoint = ""
leaseSeconds = 30
weight = 1

# [oidc]
# Every social provider is disabled until its credentials are complete.
# Enable providers independently; missing credentials return an unavailable
# feature response instead of preventing Stargate from starting.
[oidc]
google = { clientId = "", clientSecret = "" }
apple = { clientId = "", teamId = "", keyId = "", privateKeyPath = "Keys/Solarpass.p8" }
microsoft = { clientId = "", clientSecret = "", discoveryEndpoint = "" }
steam = { apiKey = "" }
discord = { clientId = "", clientSecret = "" }
github = { clientId = "", clientSecret = "" }
afdian = { clientId = "", clientSecret = "" }
twitter = { clientId = "", clientSecret = "" }
# Last.fm uses an API key + shared secret instead of OAuth2 client
# credentials. Register {SiteUrl}/auth/callback/lastfm as the API account's
# callback URL.
lastfm = { apiKey = "", apiSecret = "" }

# Security controls: fail2ban (IP-level blocking after repeated failures),
# challenge risk escalation, and per-account security mode preferences.
[security]
# Number of failed challenge attempts from the same IP before it is blocked.
fail2banMaxFails = 5
# Time window for counting failures (fail2ban resets after this).
fail2banWindow = "15m"
# Duration an IP stays blocked once the limit is reached.
fail2banBlockFor = "30m"
# Number of challenges an IP may start that get declined by a trusted session
# before that IP is blocked for fail2banBlockFor. Declines are charged to the
# IP that started the login, and a later successful login from it does not
# clear them. The counting window is fail2banWindow. "0" disables the tracking.
fail2banDeclineMax = 3
# After this many failures within a single challenge, the challenge is
# escalated to require all available factors (unless the account's mode
# overrides it).
challengeFailEscalateAfter = 2
# Maximum number of new challenges a single IP may create within
# challengeWindow. A challenge that completes into a session releases its
# slot, so successful logins never count against the quota. "0" disables it.
maxChallengesPerIp = 3
# Rolling window for the per-IP new-challenge quota.
challengeWindow = "1h"
# Maximum failed credential submissions one challenge accepts before further
# verification is refused with 429. The per-IP fail2ban block normally trips
# first; this cap stops a caller that spreads guesses across addresses (or
# stays under the fail2ban threshold) from grinding a single challenge. "0"
# disables the cap.
maxChallengeAttempts = 5
# How many reverse proxies in front of Stargate append to X-Forwarded-For.
# The client IP is taken that many entries from the RIGHT, so a
# client-supplied leftmost entry can never choose the address fail2ban and
# the per-IP quotas see. Deployment assumption: the edge must append to (or
# overwrite) X-Forwarded-For, never pass a client-supplied header through
# untouched. Default 1 = Blade.
trustedProxyHops = 1
# After a login completes, a new challenge from the same user agent within
# this window ignores the IP-novelty risk terms: a rotated IP (mobile NAT,
# IPv6 privacy addresses, Wi-Fi/cellular switches) is not a device change.
# "0" disables the suppression.
recentLoginGrace = "30m"
# Maximum time since last activity for a native-device session to be
# considered "trusted" (only trusted sessions may approve/decline logins).
trustedSessionMaxGap = "720h"
# How long an elevation ("sudo") grant lasts after a session completes an
# elevation challenge (POST /api/auth/sudo). Auth-critical mutations require a
# live grant. Default "5m".
sudoModeLifetime = "5m"
# How long an elevation challenge (and its emailed fallback code) stays valid.
# Default "10m".
sudoChallengeLifetime = "10m"

# RFC 9116 vulnerability-disclosure block served at /.well-known/security.txt.
# Falls back to mailto:security@solsynth.dev when unset.
[securityTxt]
contact = "mailto:security@solsynth.dev"
