siteUrl = "http://localhost:3000"
baseUrl = "http://localhost:5011"

[http]
port = "8080"

[grpc]
port = "9090"
# TLS is on by default (the C# fleet and Blade dial https://_grpc.stargate).
# server.crt/server.key are issued by the DysonNetwork CA (self-signed);
# clients skip CA validation, mirroring the fleet convention.
useTLS = true
certFile = "Keys/server.crt"
keyFile = "Keys/server.key"

[database]
dsn = "host=localhost port=5432 user=postgres dbname=dyson_stargate sslmode=disable"

[redis]
# Optional cache/session acceleration. Empty disables cache-backed features.
addr = ""
password = ""
db = 0

[nats]
# Optional event bus. Empty disables event consumers and realtime publishing.
target = ""
sessionEventsStream = "auth_session_events"
sessionEventsSubject = "auth.session.revoked"
websocketPushStream = "websocket_push"
websocketPushSubject = "websocket.push"

[auth]
issuer = "solar-network"
# Issuers accepted for both ordinary and OIDC access/refresh tokens. Keep old
# values here when changing issuer so already-issued tokens remain usable.
validIssuers = ["solar-network", "https://nt.solian.app"]
audiences = ["http://localhost:5071", "https://localhost:7099"]
publicKeyPath = "Keys/PublicKey.pem"
privateKeyPath = "Keys/PrivateKey.pem"
accessTokenLifetime = "5m"
refreshTokenLifetime = "720h"
cookieDomain = "localhost"
cookieSecure = false

[oidcProvider]
issuerUri = "https://nt.solian.app"
publicKeyPath = "Keys/PublicKey.pem"
privateKeyPath = "Keys/PrivateKey.pem"
accessTokenLifetime = "5m"
refreshTokenLifetime = "720h"
authorizationCodeLifetime = "30m"
requireHttpsMetadata = true

# Optional local OAuth/OIDC clients. Use these when DysonNetwork.Develop is
# unavailable. The client ID must be stable because it is stored in OAuth
# sessions. status=2 means Production and enforces redirectUris; status=1
# (Staging) accepts any redirect URI, matching Develop's behavior.
# [[oidcProvider.clients]]
# id = "00000000-0000-0000-0000-000000000001"
# slug = "my-local-client"
# name = "My Local Client"
# clientSecret = "replace-with-a-secret"
# status = 2
# homeUri = "https://client.example.com"
# redirectUris = ["https://client.example.com/oauth/callback"]
# allowedScopes = ["openid", "profile", "email"]
# isPublicClient = false

[captcha]
provider = "cloudflare"
apiKey = "0x4AAAAAABCDUdOujj4feOb_"
apiSecret = ""
skip = true

[webauthn]
rpId = "localhost"
rpName = "Solar Network"

# Account activation (mirrors Passport's AccountActivation). Entry-test (exam)
# logic stays in Passport: when testsEnabled is true and requiredTestKeys is
# non-empty, contact verification does NOT activate the account here — Passport
# evaluates the attempts and publishes accounts.activated, which Stargate
# consumes. With no required tests (default), a verified contact activates the
# account immediately.
[accountActivation]
testsEnabled = false
requiredTestKeys = []

[geoip]
databasePath = "Keys/GeoLite2-City.mmdb"

# Outbound gRPC integrations are optional. An empty target disables the
# corresponding enrichment, notification, lookup, or realtime feature; the
# remaining Stargate routes continue to serve.
# A configured target is lazy-dialed and RPC failures also degrade per feature.
# Develop is only needed when no matching local OAuth client is configured.
# Wallet, Drive, Pass, Ring, and Blade may remain empty independently.
#
# Keep the table active with empty defaults for simple environment overrides.
# Each target may be set independently.
[services]
develop = { grpc = "" }
drive = { grpc = "" }
wallet = { grpc = "" }
pass = { grpc = "" }
blade = { grpc = "" }
ring = { grpc = "" }

[discovery]
# Register with Blade service discovery so Blade's /meta capability
# aggregator and proxy resolve this instance (auth.*, e2ee, permissions,
# admin.*, accounts.*). Mirror the C# Blade:ServiceDiscovery settings.
enabled = false
target = "blade:9090"
registrationToken = ""
service = "stargate"
instanceId = ""
# Defaults mirror the C# fallback: http://{service}:{httpPort} and
# {service}:{grpcPort}; Blade probes {httpEndpoint}/health and fetches
# capabilities from {grpcEndpoint}.
httpEndpoint = ""
grpcEndpoint = ""
leaseSeconds = 30
weight = 1

# [oidc]
# Every social provider is disabled until its credentials are complete.
# Enable providers independently; missing credentials return an unavailable
# feature response instead of preventing Stargate from starting.
[oidc]
google = { clientId = "", clientSecret = "" }
apple = { clientId = "", teamId = "", keyId = "", privateKeyPath = "Keys/Solarpass.p8" }
microsoft = { clientId = "", clientSecret = "", discoveryEndpoint = "" }
steam = { apiKey = "" }
discord = { clientId = "", clientSecret = "" }
github = { clientId = "", clientSecret = "" }
afdian = { clientId = "", clientSecret = "" }
twitter = { clientId = "", clientSecret = "" }
